name: Yearly rebuild

# The footer year and "years in business" are worked out from today's date when the
# site is built. This workflow rebuilds the site on 1 January (new copyright year) and on
# 22 August (founding anniversary, so "28 years" becomes "29 years") by pushing an empty
# commit, which Cloudflare picks up and deploys. It can also be run by hand.

on:
  schedule:
    - cron: '10 0 1 1 *'
    - cron: '10 0 22 8 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push an empty commit to trigger a fresh build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Scheduled rebuild: refresh year and years in business"
          git push
